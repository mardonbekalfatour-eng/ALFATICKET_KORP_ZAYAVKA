<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A1A33">
<title>ALFA TICKET — заявка</title>
<link rel="preconnect" href="https://telegram.org">
<link rel="preload" as="image" href="logo_white.png">
<link rel="preload" as="font" type="font/woff" href="fonts/m400.woff" crossorigin>
<link rel="preload" as="font" type="font/woff" href="fonts/m700.woff" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:Montserrat;font-weight:400;font-display:swap;src:url(fonts/m400.woff) format('woff')}
@font-face{font-family:Montserrat;font-weight:500;font-display:swap;src:url(fonts/m500.woff) format('woff')}
@font-face{font-family:Montserrat;font-weight:600;font-display:swap;src:url(fonts/m600.woff) format('woff')}
@font-face{font-family:Montserrat;font-weight:700;font-display:swap;src:url(fonts/m700.woff) format('woff')}
@font-face{font-family:Montserrat;font-weight:800;font-display:swap;src:url(fonts/m800.woff) format('woff')}
:root{color-scheme:dark;--bg:#0A1A33;--card:#10264A;--card2:#13305A;--line:#23395E;--dash:#2E4A78;--tx:#F2F5FA;--mut:#A9B6C9;--sub:#D2DAE6;--blue:#164C9A;--sky:#5B93E6;--link:#7FB0FF;--ok:#4FC08D;--err:#FF7A7A;--red:#C93B3B;--gold:#F5B21A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:15px/1.45 Montserrat,Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex-shrink:0}
.wrap{max-width:520px;margin:0 auto;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.hide{display:none!important}

/* ---------- Анимации ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes trail{0%{stroke-dashoffset:100;opacity:1}88%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes planeFly{0%{offset-distance:0%;opacity:0}8%,88%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes bump{0%{transform:translateY(0)}40%{transform:translateY(-4px);opacity:.4}100%{transform:none;opacity:1}}
@keyframes morph{to{width:52px;border-radius:26px}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes takeoff{to{transform:translate(60px,-110vh) scale(.6)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:48}to{stroke-dashoffset:0}}
@keyframes print{from{transform:translateY(-104%)}to{transform:none}}
@keyframes tear{to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

/* ---------- Заставка ---------- */
.splash{min-height:100vh;display:flex;flex-direction:column;padding:0 20px 40px}
.splash .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.splash .lg1{width:150px;height:auto;animation:rise .6s ease-out both}
.traj{position:relative;width:220px;height:50px}
.traj svg{position:absolute;left:0;top:0}
.traj .tr2{stroke-dasharray:100;animation:trail 2.2s ease-in-out infinite}
.traj .pl{width:24px;height:22px;offset-path:path('M4 46 C 70 46, 120 40, 216 14');offset-rotate:auto;offset-anchor:center;animation:planeFly 2.2s ease-in-out infinite}
.ldt{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:center}
.sk{height:56px;border-radius:8px;background:var(--card);animation:shimmer 1.6s ease-in-out infinite}
.skr{display:flex;flex-direction:column;gap:12px}
.skr>div:nth-child(2){display:flex;gap:12px}.skr>div:nth-child(2) .sk{flex:1}
.center{padding:80px 28px;text-align:center;color:var(--mut)}

/* ---------- Шапка ---------- */
#form.in>*,#home.in>*{animation:rise .45s ease-out both}
.top .lh{height:30px;width:auto}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 16px}
.kind{display:flex;flex-direction:column;align-items:flex-start;gap:16px;min-height:120px;padding:18px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sky);text-align:left;transition:transform .1s}
.kind:active{transform:scale(.97)}
.kind.on{background:var(--blue);border-color:var(--blue);color:#fff}
.kind b{display:block;font-size:16px;color:var(--tx);font-weight:700}
.kind.on b{color:#fff}
.kind small{display:block;font-size:12px;color:var(--mut);margin-top:2px;font-weight:500}
.kind.on small{color:#D6E2F5}
.rlist{margin:0 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;min-height:56px;border:none;border-bottom:1px solid var(--line);background:transparent;color:var(--tx);text-align:left}
.rrow:last-child{border-bottom:none}
.rrow:active{background:var(--card2)}
.rrow b{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.04em;min-width:0}
.rrow b svg{color:var(--sky)}
.rrow span{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lastr{display:flex;gap:12px;align-items:center;margin:16px 16px 0;padding:14px 16px;border-radius:8px;border:1px dashed var(--line)}
.lastr b{font-size:14px;display:block;font-weight:600}.lastr small{font-size:12px;color:var(--mut)}
.fh{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 20px 2px}
.fk{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftl{font-size:28px;line-height:34px;font-weight:700;margin-top:2px}
.fh .ic{height:40px;width:auto}
.tripc{margin:0 16px 10px}
#trip .chip.on{background:#F2F5FA;border-color:#F2F5FA;color:#0B2C5E}
.rtk{padding:0 14px}
.rtk .pt{position:relative;padding:12px 52px 14px 0}
.rtk .acw{position:static}
.rtk .acl{left:-14px;right:-14px}
.lbl2{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pv{display:flex;align-items:baseline;gap:10px;min-width:0}
.pv .code{font-size:24px;line-height:28px;font-weight:700;letter-spacing:.04em;flex-shrink:0}
.pv .code:empty{display:none}
.pv .in{padding:6px 0 0;font-size:17px;font-weight:600}
.pv .code:not(:empty)+.acw .in{color:var(--sub);font-size:15px;font-weight:500}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 16px 10px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 10px 6px 14px;min-width:0}
.dc .in{font-size:15px;font-weight:600;padding:6px 0;letter-spacing:0;min-width:0}
.dc .in::placeholder{font-weight:500}
.dc .cal{width:34px;height:34px}
.dc .dh{margin:0;min-height:18px}
.fls{padding:2px 14px}
.mcw{padding:4px 14px}
#cls,#tcls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#cls .chip,#tcls .chip{border-radius:8px;height:46px;padding:0 6px;font-size:14px;text-align:center}
.okl{height:28px;width:auto;display:block;margin:0 auto 26px}
.top{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.top .ic{height:36px;width:auto}
.co{font-size:12px;font-weight:600;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:6px 10px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langs{margin-left:auto;display:flex;gap:2px}
.lg{border:none;background:transparent;font-size:12px;font-weight:600;padding:6px 8px;border-radius:4px;color:var(--mut)}
.lg.on{background:var(--card);color:var(--tx)}
.hello{padding:14px 20px 4px}
.hi{font-size:15px;color:var(--mut)}
.nm{font-size:30px;line-height:36px;font-weight:700;margin-top:2px;word-break:break-word}
.sub{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%}

/* ---------- Блоки ---------- */
.st{font-size:12px;font-weight:600;color:var(--mut);margin:20px 20px 8px;letter-spacing:.08em;text-transform:uppercase}
.sec{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;margin:0 16px 10px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sec>.chips{padding:8px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:500;background:transparent;color:var(--sub);transition:background .2s,border-color .2s,color .2s,transform .1s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.rw{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:10px;font-size:14px}
.rw+.rw{border-top:1px solid var(--line)}
.ri{color:var(--mut);display:flex;align-items:center;justify-content:center;width:22px}
.cn{display:flex;align-items:center;gap:10px}
.cn b{min-width:18px;text-align:center;font-size:17px;display:inline-block}
.cn b.bump{animation:bump .25s ease-out}
.cn button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.cn button:active{transform:scale(.92)}
.cn button[data-d="1"]{background:var(--blue);border-color:var(--blue)}
.in{border:none;background:transparent;width:100%;font-size:16px;padding:10px 0;outline:none;color:var(--tx)}
.in::placeholder{color:#8796AD}
.er{font-size:13px;color:var(--err);margin:-2px 22px 10px}
.er:empty{display:none}
.er:not(:empty){animation:shake .35s ease-out}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;border:none;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s cubic-bezier(.4,0,.2,1)}
.sw.on{background:var(--blue)}.sw.on::after{left:21px}.sw.red.on{background:var(--red)}
.seg{display:flex;background:var(--card);border-radius:8px;padding:4px;margin:16px 16px 10px;gap:4px;position:relative}
.seg button{flex:1;border:none;border-radius:4px;height:44px;font-size:14px;font-weight:600;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,color .25s}
.seg button.on{background:var(--blue);color:#fff}
.soon{display:block;font-size:10px;font-weight:500;opacity:.8}
.seg button.dis{opacity:.55}
.urg{display:flex;align-items:center;gap:12px;padding:12px 14px;transition:background .25s}
.urg.on{background:rgba(201,59,59,.18);border-color:rgba(255,122,122,.35)}
.ut{font-size:14px;font-weight:600}.us{font-size:12px;color:var(--mut)}
.nt{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:12px 14px;margin:0 16px 10px;font-size:13px;line-height:1.5;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.nt>svg{margin-top:1px}
.nt b{color:var(--tx)}
.nt.demo{border-color:rgba(245,178,26,.45)}
.ppl{margin-top:8px;font-size:12px;color:var(--mut)}
.ppm{color:var(--link);text-decoration:underline;font-weight:600}
.ppc{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-weight:600;color:var(--tx);cursor:pointer}
.ppc input{width:20px;height:20px;margin:1px 0 0;flex-shrink:0;accent-color:#3D7DD8}
.sub2{margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:6px 0 8px}
.acw{position:relative;flex:1;min-width:0}
.acl{position:absolute;left:-36px;right:-14px;top:100%;z-index:30;background:var(--card2);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.45);max-height:260px;overflow:auto;display:none}
.aci{padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line);color:var(--sub)}
.aci:last-child{border-bottom:none}
.aci:active{background:var(--blue);color:#fff}
.df{display:flex;align-items:center;gap:8px;flex:1}
.df .in{letter-spacing:.03em}
.cal{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(91,147,230,.14);color:var(--sky);flex-shrink:0}
.cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.dh{font-size:12px;color:var(--mut);margin:-2px 0 6px}
.dh.bad{color:var(--err)}
.rw .lb{color:var(--mut);min-width:66px;font-size:13px;font-weight:500}
.rw.fl .in{font-size:14px}
.leg{border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:8px 0}
.legh{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.lnk{border:none;background:transparent;color:var(--link);font-size:14px;font-weight:600;padding:10px 0}
.more{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 32px);margin:16px 16px 10px;border:1px dashed var(--dash);border-radius:8px;background:transparent;color:var(--sub);font-size:14px;font-weight:500;padding:14px 16px}
.more svg{transition:transform .25s}
.more.open svg{transform:rotate(180deg)}
select{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:8px;height:38px;padding:0 10px;font-size:14px}
#moreBox{animation:rise .3s ease-out}

/* ---------- Маршрут как билет ---------- */
.tear{position:relative;height:0;border-top:1.5px dashed var(--dash);margin:4px 0}
.tear::before,.tear::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tear::before{left:-26px;border-left-color:transparent;border-top-color:transparent;transform:rotate(-45deg)}
.tear::after{right:-26px;border-right-color:transparent;border-bottom-color:transparent;transform:rotate(-45deg)}
.swap{position:absolute;right:4px;top:-22px;width:44px;height:44px;border-radius:8px;border:none;background:var(--blue);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .35s cubic-bezier(.4,0,.2,1)}
.swap.turn{transform:rotate(180deg)}
#simple .rw.ft{padding-right:52px}
.recent{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 16px 10px}
.recent .rl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-right:2px}
.recent .chip{padding:7px 12px}

/* ---------- Кнопка отправки ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid #10264A;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.bar .er{position:absolute;left:0;right:0;bottom:100%;margin:0;padding:10px 20px;background:var(--bg);text-align:center}
.mb{position:relative;width:100%;max-width:488px;height:52px;border:none;border-radius:8px;background:#fff;color:#0B2C5E;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;overflow:visible;transition:transform .1s}
.mb:active{transform:scale(.98)}
.mb:disabled{opacity:.7}
.mb .mbp{position:absolute;opacity:0}
.mb.go{animation:morph .35s cubic-bezier(.4,0,.2,1) forwards}
.mb.go .mbt{animation:fadeOut .15s forwards}
.mb.go .mbp{animation:fadeIn .15s .2s forwards}
.mb.go .mbp svg{animation:takeoff .7s .45s cubic-bezier(.55,0,.85,.35) forwards}
.mb2{width:100%;height:52px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--tx);font-weight:600;font-size:15px;margin-top:10px}
.mb3{width:100%;height:52px;border-radius:8px;border:none;background:#fff;color:#0B2C5E;font-weight:700;font-size:15px;margin-top:10px}

/* ---------- Заявка принята ---------- */
.ok{padding:22px 20px 10px;text-align:center}
.oki{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;background:var(--blue);animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
.oki .chk{stroke-dasharray:48;animation:draw .5s .3s ease-out both}
.okt{font-size:26px;line-height:32px;font-weight:700}
.oks{font-size:14px;color:var(--mut);margin:8px 0 14px;line-height:1.55}
.tk{position:relative;padding-top:4px;margin:18px 0 16px;text-align:left}
.tk .slot{position:absolute;left:0;right:0;top:0;height:8px;border-radius:4px;background:#050E1D;z-index:2}
.tk .clip{overflow:hidden;margin:0 8px}
.tkc{position:relative;background:#F2F5FA;color:#0F1B2D;border-radius:0 0 8px 8px;animation:print .95s .8s cubic-bezier(.2,.8,.2,1) both;will-change:transform}
.tkt{padding:18px 18px 16px}
.tkh{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5A6678}
.tkh .wait{animation:pulse 1.2s ease-in-out infinite}
.tkr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.rt{flex:1;min-width:76px;max-width:150px;display:block;cursor:pointer}
.rt svg{display:block;width:100%;height:auto;overflow:visible}
.tkr.stack{flex-wrap:wrap;row-gap:6px}
.tkr.stack .rt{order:3;flex:0 0 100%;max-width:none;display:flex;justify-content:center;padding-top:2px}
.tkr.stack .rt svg{width:min(240px,100%)}
.rt .base{fill:none;stroke:#C3CFE0;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:2 4}
.rt .rail{fill:none;stroke:#C3CFE0;stroke-width:1.2}
.rt .slp{fill:none;stroke:#D5DEEA;stroke-width:5;stroke-dasharray:1.2 4.8}
.rt .prog{fill:none;stroke:#3D7DD8;stroke-width:1.8;stroke-linecap:round}
.rt .dot{fill:#164C9A}.rt .ring{fill:#F2F5FA;stroke:#164C9A;stroke-width:1.6}
.rt .node{fill:#F2F5FA;stroke:#3D7DD8;stroke-width:1.4;transition:fill .25s}.rt .node.on{fill:#3D7DD8}
.rt .veh{transition:opacity .14s linear}
.tkr .c{display:flex;flex-direction:column;min-width:0}
.tkr .c:last-child{align-items:flex-end;text-align:right}
.tkr b{font-size:30px;line-height:34px;font-weight:800;color:#164C9A;letter-spacing:.02em}
.tkr b.long{font-size:20px;line-height:26px}
.tkr span{font-size:12px;color:#5A6678;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tkl{height:0;border-top:1.5px dashed #B8C5D8;margin:0 14px;transform:scaleX(0);transform-origin:left;animation:tear .4s 1.75s ease-out forwards}
.tkn{position:absolute;top:var(--ny,118px);width:20px;height:20px;border-radius:50%;background:var(--bg)}
.tkn.l{left:-10px}.tkn.r{right:-10px}
.tkg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 18px 16px}
.tkg div{display:flex;flex-direction:column;gap:2px;min-width:0}
.tkg small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5A6678}
.tkg span{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.okafter{animation:rise .4s 1.75s ease-out both}
.qr{width:min(78vw,300px);height:auto;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;border-radius:8px;background:#fff;padding:8px;display:block;margin:6px auto;cursor:zoom-in}
.qrfull{position:fixed;inset:0;z-index:99;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.qrfull img{width:min(92vw,92vh);height:auto;image-rendering:pixelated}
.qrfull div{color:#555;font-size:14px}
#qrBox .nt{margin:10px 0 0;text-align:left}
</style>
</head>
<body>

function hap(kind) {
  try {

  } catch (e) {}
}

  const c = '#0A1A33';
  try { tg.setHeaderColor(c); } catch (e) { try { tg.setHeaderColor('bg_color'); } catch (x) {} }

// ---------- Время Ташкента ----------
function tashParts() {
  const now = new Date();
  const date = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tashkent', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tashkent', weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(now);
  const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.find(x => x.type === 'weekday').value);
  const h = (+p.find(x => x.type === 'hour').value % 24) + (+p.find(x => x.type === 'minute').value) / 60;
  return { date, wd, h };
}
function period() {
  const { date, wd, h } = tashParts();
  if (h < 9) return 'night';
  if (HOL.includes(date)) return 'eve';
  if ((wd >= 1 && wd <= 5 && h >= 10 && h < 18) || (wd === 6 && h >= 10 && h < 16)) return 'open';
  return 'eve';
}
function today() { return new Date(tashParts().date + 'T00:00:00'); }

    '<div class="tkl"></div><div class="tkn l"></div><div class="tkn r"></div>' +
    '<div class="tkg"><div><small>' + esc(t.tkDates) + '</small><span>' + esc(v.dates) + '</span></div><div><small>' + esc(t.tkPax) + '</small><span>' + esc(v.pax) + '</span></div><div><small>' + esc(t.tkCls) + '</small><span>' + esc(v.cls) + '</span></div></div>';
  const top = $('tk').querySelector('.tkt').offsetHeight;
  $('tk').style.setProperty('--ny', (top - 10) + 'px');
  // анимация маршрута один раз, после печати билета; при повторной отрисовке сразу финал
  const rt = $('rt');
  if (last.played) routeAnim(rt, v.kind, 0, true);
  else { last.played = true; routeAnim(rt, v.kind, 2200, false); }
  rt.onclick = () => { hap('tap'); routeAnim(rt, v.kind, 0, false); };
}

// ---------- Анимация маршрута в билете ----------
// pl = самолёт, tr = поезд; ow = в одну сторону, rt = туда-обратно, mc = сложный маршрут
const ROUTES = {
  'pl-ow': { vb: '0 0 120 40', legs: ['M8 32 Q60 -2 112 32'], veh: 'pl', dur: 1300 },
  'pl-rt': { vb: '0 0 120 46', legs: ['M8 21 Q60 -9 112 21', 'M112 27 Q60 57 8 27'], veh: 'pl', dur: 1100 },
  'pl-mc': { vb: '0 0 120 40', legs: ['M8 32 Q34 2 60 20', 'M60 20 Q86 38 112 9'], veh: 'pl', dur: 850, nodes: [[60, 20]], smooth: true },
  'tr-ow': { vb: '0 0 120 34', legs: ['M27 26 L100 26'], rails: ['M3 26 L117 26'], veh: 'tr', dur: 1400 },
  'tr-rt': { vb: '0 0 120 46', legs: ['M27 17 L100 17', 'M93 39 L20 39'], rails: ['M3 17 L117 17', 'M3 39 L117 39'], veh: 'tr', dur: 1200 }
};
const PLANE_G = '<g transform="scale(.62)"><use href="#i-jet" x="-12" y="-11" width="24" height="22" fill="#164C9A"/></g>';
const TRAIN_G = '<g><rect x="-23" y="-11" width="17" height="9.5" rx="2" fill="#3D7DD8"/><rect x="-20.5" y="-8.6" width="3.6" height="3" rx=".6" fill="#F2F5FA"/><rect x="-14.5" y="-8.6" width="3.6" height="3" rx=".6" fill="#F2F5FA"/><path d="M-6 -4.5H-4" stroke="#0B2C5E" stroke-width="1.2"/><path d="M-4 -12H6.5Q12.5 -12 14.5 -5V-1.5H-4Z" fill="#164C9A"/><rect x="-1.5" y="-9.6" width="3.6" height="3" rx=".6" fill="#F2F5FA"/><path d="M4.5 -9.6H8Q10.6 -9.6 11.6 -6.6H4.5Z" fill="#F2F5FA"/><circle cx="-19" cy="-.6" r="1.6" fill="#0B2C5E"/><circle cx="-10" cy="-.6" r="1.6" fill="#0B2C5E"/><circle cx="0" cy="-.6" r="1.6" fill="#0B2C5E"/><circle cx="10" cy="-.6" r="1.6" fill="#0B2C5E"/></g>';
function routeSvg(kind) {
  const r = ROUTES[kind] || ROUTES['pl-ow'];
  let h = '<svg viewBox="' + r.vb + '" aria-hidden="true">';
  (r.rails || []).forEach(d => { h += '<path class="slp" d="' + d + '"/><path class="rail" d="' + d + '"/>'; });
  r.legs.forEach(d => {
    if (!r.rails) h += '<path class="base" d="' + d + '"/>';
    h += '<path class="prog" d="' + d + '"/>';
  });
  const a = /^M([\d.]+) ([\d.]+)/.exec(r.legs[0]), z = /([\d.]+) ([\d.]+)$/.exec(r.legs[r.legs.length - 1]);
  if (r.veh === 'pl') {
    h += '<circle class="dot" cx="' + a[1] + '" cy="' + a[2] + '" r="2.4"/>';
    if (kind !== 'pl-rt') h += '<circle class="ring" cx="' + z[1] + '" cy="' + z[2] + '" r="2.6"/>';
  }
  (r.nodes || []).forEach(n => { h += '<circle class="node" cx="' + n[0] + '" cy="' + n[1] + '" r="2.6"/>'; });
  h += '<g class="veh" style="opacity:0"><g class="vg">' + (r.veh === 'tr' ? TRAIN_G : PLANE_G) + '</g></g></svg>';
  return h;
}
let routeRaf = 0, routeTimer = 0;
function routeAnim(root, kind, delay, instant) {
  cancelAnimationFrame(routeRaf); clearTimeout(routeTimer);
  if (!root) return;
  const r = ROUTES[kind] || ROUTES['pl-ow'];
  const paths = qs('.prog', root), veh = root.querySelector('.veh'), vg = root.querySelector('.vg'), nodes = qs('.node', root);
  const lens = paths.map(p => p.getTotalLength());
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const place = (i, f) => {
    const p = paths[i], L0 = lens[i], at = p.getPointAtLength(L0 * f);
    if (r.veh === 'tr') {
      const dir = p.getPointAtLength(L0).x >= p.getPointAtLength(0).x ? 1 : -1;
      veh.setAttribute('transform', 'translate(' + at.x.toFixed(2) + ' ' + at.y.toFixed(2) + ')');
      vg.setAttribute('transform', 'scale(' + dir + ' 1)');
    } else {
      const a1 = p.getPointAtLength(Math.max(0, L0 * f - .6)), a2 = p.getPointAtLength(Math.min(L0, L0 * f + .6));
      const ang = Math.atan2(a2.y - a1.y, a2.x - a1.x) * 180 / Math.PI;
      veh.setAttribute('transform', 'translate(' + at.x.toFixed(2) + ' ' + at.y.toFixed(2) + ') rotate(' + ang.toFixed(1) + ')');
    }
  };
  const setProg = (i, f) => { paths[i].style.strokeDasharray = lens[i] + ' ' + lens[i]; paths[i].style.strokeDashoffset = (lens[i] * (1 - f)).toFixed(2); };
  const finish = () => { paths.forEach((p, i) => setProg(i, 1)); nodes.forEach(n => n.classList.add('on')); place(paths.length - 1, 1); veh.style.opacity = 1; };
  let reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (instant || reduce) { finish(); return; }
  paths.forEach((p, i) => setProg(i, 0)); nodes.forEach(n => n.classList.remove('on'));
  place(0, 0); veh.style.opacity = 0;
  const GAP = r.smooth ? 0 : 260; // пауза между участками: самолёт/поезд «разворачивается»
  const start = () => {
    veh.style.opacity = 1;
    let t0 = performance.now(), leg = 0;
    const step = now => {
      let el = now - t0;
      if (leg > 0 && GAP && el < 0) { routeRaf = requestAnimationFrame(step); return; }
      const f = Math.min(1, el / r.dur), e = ease(f);
      setProg(leg, e); place(leg, e);
      if (f < 1) { routeRaf = requestAnimationFrame(step); return; }
      if (nodes[leg]) nodes[leg].classList.add('on');
      leg++;
      if (leg >= paths.length) return;
      if (GAP) {
        veh.style.opacity = 0;
        routeTimer = setTimeout(() => { place(leg, 0); veh.style.opacity = 1; t0 = performance.now(); routeRaf = requestAnimationFrame(step); }, GAP);
      } else { t0 = now; routeRaf = requestAnimationFrame(step); }
    };
    routeRaf = requestAnimationFrame(step);
  };
  if (delay) routeTimer = setTimeout(start, delay); else start();
}

// ---------- Отправка: экран «принята» показываем сразу, заявка уходит в фоне ----------
let sending = false, last = null;
function post(body) {
  const go = url => fetch(url, { method: 'POST', body }).then(r => r.json());
  // если ускоритель недоступен, отправляем напрямую в Apps Script
  return VIA_CF ? go(API).catch(() => go(API_DIRECT)) : go(API);
}
async function send() {
  if (sending) return;
  const data = collect(); if (!data) return;
  const t = T[L], b = $('send');
  if (DEMO) {
    const dc = $('demoC').value.trim();
    if (dc.length < 5) { $('e6').textContent = t.eDemo; hap('error'); $('demoC').focus(); return; }
    data.comment = 'Контакт: ' + dc + (data.comment ? ' · ' + data.comment : '');
  }
  sending = true; hap('press');
  const body = JSON.stringify({ kind: 'request', code: CODE, initData: tg ? tg.initData : '', data });
  const req = post(body).catch(() => new Promise(r => setTimeout(r, 1500)).then(() => post(body))); // одна повторная попытка
  b.classList.add('go');
  last = { id: null, urgent: data.urgent, p: data.period, pay: data.payKey, tv: ticketView(), played: false };
  saveRecent();
  setTimeout(() => { if (sending || (last && last.id)) showOk(); }, 1100);
  let j = null;
  try { j = await req; } catch (e) { j = null; }
  if (j && j.ok) {
    last.id = j.id; sending = false;
    try { const n = new Date(), pad = x => String(x).padStart(2, '0');
      localStorage.setItem(LKEY(), JSON.stringify({ id: j.id, s: last.tv.A + ' → ' + last.tv.B, at: pad(n.getDate()) + '.' + pad(n.getMonth() + 1) + ' ' + pad(n.getHours()) + ':' + pad(n.getMinutes()) })); } catch (e) {}
    if (!$('ok').classList.contains('hide')) {
      const w = $('tk').querySelector('.wait'); if (w) { w.classList.remove('wait'); w.textContent = t.tkReq + ' №' + j.id; }
      $('again').disabled = false;
    }
    hap('success');
    return;
  }
  // Не ушло: возвращаем клиента к форме, всё заполненное сохранено
  sending = false;
  $('ok').classList.add('hide'); $('form').classList.remove('hide'); b.classList.remove('go');
  $('e6').textContent = j && j.error === 'auth' ? t.eAuth : j && j.error === 'client' ? t.eClient : t.eNet;
  hap('error');
}
function showOk() {
  show('ok');
  okFill(); renderTicket();
  // перезапуск анимаций
  qs('#ok .oki, #ok .tkc, #ok .okafter').forEach(e => { e.style.animation = 'none'; void e.offsetWidth; e.style.animation = ''; });
}
function okFill() {
  if (!last) return;
  const t = T[L], p = last.p; let S, icon, bg = 'var(--blue)';
  if (last.urgent) { S = p === 'night' ? t.okUN : t.okU; bg = 'var(--red)'; icon = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>'; }
  else { S = p === 'open' ? t.okOpen : p === 'eve' ? t.okEve : t.okNight; icon = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none"><path class="chk" d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  if (DEMO) S = t.okDemo;
  $('okT').textContent = t.okAcc; $('okS').textContent = S;
  $('okP').textContent = last.pay === 'bank' ? t.okBank : last.pay === 'cash' ? t.okCash : t.okQr;
  $('qrBox').classList.toggle('hide', last.pay !== 'qr');
  const e = $('okI'); e.style.background = bg; e.innerHTML = icon;
  $('again').disabled = !last.id;
}

// ---------- Запуск ----------
function fatal(msg) { $('fatal').textContent = msg; show('fatal'); }

async function init() {
  theme();
  try { const saved = localStorage.getItem('alfa_lang'); if (saved && T[saved]) L = saved; else if (tg && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code === 'uz') L = 'uz'; } catch (e) {}
  $('ldT').textContent = T[L].ld;
  if (tg) { tg.ready(); tg.expand(); }
  CODE = (tg && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('c') || '';
  if (!CODE) return fatal(T[L].eAuth);
  DEMO = CODE.toUpperCase() === 'DEMO'; $('demoBox').classList.toggle('hide', !DEMO);
  const KEY = 'alfa_init_' + CODE;
  const q = '?a=init&code=' + encodeURIComponent(CODE);
  const load = () => fetch(API + q).then(r => r.json()).catch(e => { if (!VIA_CF) throw e; return fetch(API_DIRECT + q).then(r => r.json()); });
  const apply = j => { PL = j.places || []; ST = j.stations || []; $('company').textContent = j.company; };
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (cached && cached.places && cached.places.length) {
    apply(cached); // мгновенно из памяти телефона, свежие данные подтягиваем в фоне
    load().then(j => {
      if (!j.ok) { if (j.error === 'client') { try { localStorage.removeItem(KEY); } catch (e) {} fatal(T[L].eClient); } return; }
      apply(j); try { localStorage.setItem(KEY, JSON.stringify(j)); } catch (e) {}
    }).catch(() => {});
  } else {
    try {
      const j = await load();
      if (!j.ok) return fatal(j.error === 'client' ? T[L].eClient : T[L].eNet);
      apply(j); try { localStorage.setItem(KEY, JSON.stringify(j)); } catch (e) {}
    } catch (e) { return fatal(T[L].eNet); }
  }

  D1 = dateField($('df1'), () => { checkDates(); clr(); });
  D2 = dateField($('df2'), () => { checkDates(); clr(); });

  if (fromDef) setPlace($('from'), fromDef);

  $('mode').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (!TRAIN_ON && b.dataset.m === 'tr') { $('trSoonNote').classList.toggle('hide'); return; } if (b.dataset.m === M) return;
    hap('tap'); setMode(b.dataset.m); };
  qs('.kind').forEach(b => b.onclick = () => { hap('tap'); if (!TRAIN_ON && b.dataset.k === 'tr') return; openForm(b.dataset.k); });
  $('hNew').onclick = () => { hap('press'); openForm(); };
  try { if (tg && tg.BackButton) tg.BackButton.onClick(() => { if (!$('form').classList.contains('hide')) { hap('tap'); showHome(); } }); } catch (e) {}
  $('swap').onclick = () => { const f = $('from'), to = $('to'), cf = codeEl(f), ct = codeEl(to);
    [f.value, to.value] = [to.value, f.value]; [f.dataset.ru, to.dataset.ru] = [to.dataset.ru || '', f.dataset.ru || ''];
    [f.dataset.code, to.dataset.code] = [to.dataset.code || '', f.dataset.code || '']; cf.textContent = f.dataset.code; ct.textContent = to.dataset.code;
    $('swap').classList.toggle('turn'); hap('tap'); clr(); };
  chips('trip', 0, syncTrip); chips('lay'); chips('tt'); chips('seatP'); chips('pay', 0, payHint);
  chips('dir', 1, () => $('layW').classList.toggle('hide', !on('dir').includes('via')));
  chips('add', 1, () => $('seatW').classList.toggle('hide', !on('add').includes('seat')));
  ['fare', 'cls', 'tcls', 'tm', 'ex'].forEach(i => chips(i, 1));
  sw('urg', () => $('urgBox').classList.toggle('on', swOn('urg'))); sw('flx'); sw('fb');
  $('more').onclick = () => { moreOpen = !moreOpen; $('moreBox').classList.toggle('hide', !moreOpen); $('more').classList.toggle('open', moreOpen); $('moreT').textContent = moreOpen ? T[L].less : T[L].more; hap('tap'); };
  qs('[data-c]').forEach(b => b.onclick = () => { const k = b.dataset.c, v = s[k] + +b.dataset.d; if (v < (k === 'ad' ? 1 : 0) || v > 9) return; s[k] = v; const n = $(k); n.textContent = v; n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); hap('tap'); if (k === 'ch') ages(); clr(); });
  $('addLeg').onclick = () => { const p = legs[legs.length - 1]; legs.push({ f: p.t || '', fr: p.tr || '', t: '', tr: '', d: '' }); renderLegs(); };
  $('send').onclick = send;
  $('again').onclick = () => { $('send').classList.remove('go'); renderRecent(); showHome(); };

init();
